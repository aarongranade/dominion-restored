name: MAUI app

on:
  push:
    paths: ['maui/**', 'js/**', 'index.html', 'style.css', '.github/workflows/maui.yml']
  pull_request:
    paths: ['maui/**', 'js/**', 'index.html', 'style.css', '.github/workflows/maui.yml']
  workflow_dispatch:

env:
  PROJECT: maui/DominionRestored/DominionRestored.csproj
  DOTNET_NOLOGO: true

jobs:
  game-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundled game matches the web game
        run: |
          ./maui/scripts/sync-game.sh
          git diff --exit-code -- maui/DominionRestored/wwwroot/game || { echo "::error::Run maui/scripts/sync-game.sh and commit the result"; exit 1; }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: microsoft, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet workload install maui-android
      - name: Android SDK dependencies
        run: dotnet build $PROJECT -t:InstallAndroidDependencies -f net9.0-android -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True
      - name: Build release APK (debug-signed, installable for testing)
        run: dotnet publish $PROJECT -f net9.0-android -c Release -p:AndroidPackageFormats=apk -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o out/android
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-restored-android
          path: out/android/*-Signed.apk

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: dotnet workload install maui-ios
      - name: Build for the iOS simulator (no signing needed)
        run: dotnet build $PROJECT -f net9.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
