name: MAUI app

on:
  push:
    paths: ['maui/**', 'js/**', 'index.html', 'style.css', '.github/workflows/maui.yml']
  pull_request:
    paths: ['maui/**', 'js/**', 'index.html', 'style.css', '.github/workflows/maui.yml']
  workflow_dispatch:

env:
  PROJECT: maui/DominionRestored/DominionRestored.csproj
  DOTNET_NOLOGO: true

jobs:
  game-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundled game matches the web game
        run: |
          ./maui/scripts/sync-game.sh
          git diff --exit-code -- maui/DominionRestored/wwwroot/game || { echo "::error::Run maui/scripts/sync-game.sh and commit the result"; exit 1; }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: microsoft, java-version: '17' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet workload install maui-android
      - name: Solution file loads
        run: dotnet sln maui/DominionRestored.slnx list
      - name: Android SDK dependencies
        run: dotnet build $PROJECT -t:InstallAndroidDependencies -f net10.0-android -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True
      - name: Build release APK (debug-signed, installable for testing)
        run: dotnet publish $PROJECT -f net10.0-android -p:TargetFrameworks=net10.0-android -c Release -p:AndroidPackageFormats=apk -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o out/android
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-restored-android
          path: out/android/*-Signed.apk

  ios-simulator:
    runs-on: macos-15
    # The newest .NET iOS SDK needs Xcode 27; GitHub's macOS image has 26.3. The C# compiles,
    # only the final link step fails. Drop this line once the runner image ships Xcode 27.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Use the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: dotnet workload install maui-ios
      # GitHub's Mac image can lag the Xcode version the newest .NET iOS SDK expects; a simulator
      # build still works, but App Store builds must use the matching Xcode (see maui/README.md).
      - name: Build for the iOS simulator (no signing needed)
        run: dotnet build $PROJECT -f net10.0-ios -p:TargetFrameworks=net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false -p:MtouchLink=None
