<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dominion Restored</title>
    <base href="/" />
    <style>
        html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        #app { height: 100%; }
        #game { border: 0; width: 100%; height: 100%; display: block; background: #0b0b14; }
        #blazor-error-ui { display: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="blazor-error-ui">An error occurred. <a href="" class="reload">Reload</a></div>
    <script>
        // bridge used by MainPage.SendToGame: forwards commands into the game frame
        window.drGame = {
            send: function (msg) {
                var f = document.getElementById('game');
                if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
            }
        };
        // keep hardware keyboards (iPad, Chromebook) talking to the game
        document.addEventListener('click', function () { var f = document.getElementById('game'); if (f) f.focus(); });
        // on Windows and Mac the keyboard should work straight away, before any click
        document.addEventListener('load', function (e) { if (e.target && e.target.id === 'game') e.target.focus(); }, true);
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
